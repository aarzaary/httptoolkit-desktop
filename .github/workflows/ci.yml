name: CI
on: workflow_dispatch
jobs:
  build:
    name: Build & test
    strategy:
      matrix:
        include:
          - platform: linux
            arch: x64
            os: "ubuntu-22.04"
          - platform: linux
            arch: arm64
            os: "ubuntu-24.04-arm"
          - platform: windows
            arch: x64
            os: "windows-2022"
          - platform: mac
            arch: x64
            os: "macos-15-intel"
          - platform: mac
            arch: arm64
            os: "macos-14"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          check-latest: true
          cache: 'npm'

      # Due to https://github.com/electron-userland/electron-builder/issues/3901
      # Electron-Builder fails to produce deb packages on arm64 without this:
      - name: Install system FPM to fix ARM64 Linux builds
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - run: npm ci

      - name: Run unsigned build
        if: env.IS_RELEASE != 'true'
        run: npm run build
        env:
          ENABLE_SIGNING: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' }}

      # Attempt to fix flaky tests due to CI disk perf by warming the disk up
      - name: Warm page cache before smoke tests
        if: runner.os == 'Linux'
        run: |
          for d in node_modules httptoolkit-server build; do
            [ -e "$d" ] && find "$d" -type f -print0 2>/dev/null | xargs -0 cat > /dev/null 2>&1 || true
          done
        shell: bash

      - name: Run smoke tests
        run: |
          # We manually start ADB, so the tests don't (because if they do, they fail
          # to exit, due to the hanging process)
          "$ANDROID_HOME/platform-tools/adb" start-server 2>/dev/null || true

          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run --auto-servernum npm test
          else
            npm test
          fi
        shell: bash

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'linux'
        with:
          name: HttpToolkit-linux-${{ matrix.arch }}-deb
          path: dist/HttpToolkit-*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'linux'
        with:
          name: HttpToolkit-linux-${{ matrix.arch }}-rpm
          path: dist/HttpToolkit-*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'linux'
        with:
          name: HttpToolkit-linux-${{ matrix.arch }}-AppImage
          path: dist/HttpToolkit-*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'linux'
        with:
          name: HttpToolkit-linux-${{ matrix.arch }}-zip
          path: dist/HttpToolkit-*linux*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'windows'
        with:
          name: HttpToolkit-windows-${{ matrix.arch }}-exe
          path: dist/HttpToolkit-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'windows'
        with:
          name: HttpToolkit-windows-${{ matrix.arch }}-zip
          path: dist/HttpToolkit-*win*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'mac'
        with:
          name: HttpToolkit-mac-${{ matrix.arch }}-dmg
          path: dist/HttpToolkit-*.dmg
          if-no-files-found: error
  publish:
    name: Publish a release
    runs-on: "ubuntu-22.04"
    needs: build
    steps:
      - uses: benjlevesque/short-sha@v3.0

      - name: Get all distributables
        uses: actions/download-artifact@v7

      - name: Normalize arch names to x64 or arm64
        run: |
          find . -maxdepth 2 -type f -name "*" | while read -r file; do
            filename=$(basename "$file")
            newname=$(echo "$filename" | sed -e 's/amd64/x64/g' -e 's/x86_64/x64/g' -e 's/aarch64/arm64/g')
            if [ "$filename" != "$newname" ]; then
              mv -v "$file" "$newname"
            fi
          done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_name: aarzaary/app
          repo_token: ${{ secrets.personal_token }}
          file: ./*/*
          tag: ${{ env.SHA }}
          file_glob: true
          overwrite: true